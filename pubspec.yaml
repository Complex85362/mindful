name: mindful_workspace
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - packages/core
  - apps/mobile_app
  - apps/admin_web

dev_dependencies:
  melos: ^8.2.2

melos:
  scripts:
    analyze:
      run: melos exec -- flutter analyze
      description: Run flutter analyze in every package

    format:
      run: melos exec -- dart format .
      description: Format all packages

    test:
      run: melos exec --dir-exists=test -- flutter test
      description: Run tests in every package that has one
